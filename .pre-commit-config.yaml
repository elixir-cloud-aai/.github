---
# Checks run on commit (`pre-commit install`) and in CI (`pre-commit run
# --all-files`, plus the manual-stage `gitleaks-all` hook); hook versions are
# pinned to commits, and Dependabot bumps them (`pre-commit` ecosystem)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  # Schemas of GitHub's files: issue forms and their `config.yml`, workflows,
  # composite actions (`action.yml`) and the Dependabot configuration
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df  # frozen: 0.39.0
    hooks:
      - id: check-github-issue-forms
      - id: check-github-issue-config
      - id: check-github-workflows
      # Also the shared composite actions in `actions/<name>/`
      - id: check-github-actions
        files: ^(actions/[^/]+/|\.github/actions/(.+/)?)?action\.ya?ml$
      - id: check-dependabot
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 341e2a331ba578029e66c2e01183e7a6b5ca9ab4  # frozen: v0.24.0
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      # Staged changes on commit
      - id: gitleaks
      # The whole checkout, in CI (`--hook-stage manual`); also scans
      # untracked and ignored files when run locally
      - id: gitleaks
        alias: gitleaks-all
        name: Detect hardcoded secrets (all files)
        entry: gitleaks dir --redact --verbose
        stages: [manual]
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      # Workflows (`.github/workflows/`); also checks their scripts with
      # shellcheck if it is installed (as on GitHub-hosted runners)
      - id: actionlint
