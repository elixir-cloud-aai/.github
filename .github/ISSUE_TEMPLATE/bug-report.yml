---
name: Bug report
description: Report something that doesn't work as expected.
labels: ["type: bug", "status: new"]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for taking the time to report a bug! Please search the open
        issues first, to see whether it has been reported already. Report
        vulnerabilities privately, as described in the security policy, never
        in public issues.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happens, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: >-
        How can others reproduce the bug? A minimal example (configuration,
        commands, requests) helps most.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        Which version (release or commit) are you using, and how do you run
        it (e.g., package, container image, Helm chart)?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Relevant log output or error messages, without secrets. They are
        formatted as code automatically.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: >-
        Anything else that helps: environment, screenshots, links, a possible
        solution.
