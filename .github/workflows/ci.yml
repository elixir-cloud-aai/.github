---
# Everything that must pass on pull requests and pushes to `main`: lint the
# Markdown, YAML (issue forms, workflows, the Dependabot configuration and
# the composite actions in `actions/`) and the workflows (actionlint), and
# test the composite actions (each action adds its tests to the `test` job)
# and the release scripts. The `Release` workflow (`release.yml`) requires a
# passed run for the push of the commit of a release tag to `main`.
# The gate `passed` ("CI passed") is the only required check. No `paths:`
# filters, so that the gate always reports; skip jobs with `if:` instead (and
# allow the skip in the gate)

name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs of a pull request, but only for a new head commit
# (not for a rerun, which may be of an older commit), so that a newer run on
# the same commit doesn't leave a failed gate (see
# "Cancelled runs" in actions/gate/README.md); runs for pushes get their own
# group, so that queued runs for successive pushes are not dropped
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.run_attempt == 1 }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Not bumped by Dependabot (no Python manifest); update manually
      - name: Install pre-commit
        run: pip install pre-commit==4.7.0
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run linters and security checks
        run: |
          pre-commit run --all-files --show-diff-on-failure
          pre-commit run --all-files --hook-stage manual gitleaks-all

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # check-release: read the CI runs of a release commit
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pr-title: the rules, on good and bad titles
      - name: Test PR title rules
        run: bash tests/pr-title/test.sh
      # pr-title: the action itself. Passes only if `types` (one per line)
      # reaches the script, as `deps` is not a default type
      - name: Check a good PR title
        uses: ./actions/pr-title
        with:
          title: "deps(api)!: bump pagination library"
          types: |
            fix
            deps
      # Valid but for `max-length`, so it fails only if that input reaches
      # the script
      - name: Check a bad PR title
        id: bad-title
        continue-on-error: true
        uses: ./actions/pr-title
        with:
          title: "feat(api): add pagination"
          max-length: "10"
      - name: Expect the bad PR title to fail
        env:
          OUTCOME: ${{ steps.bad-title.outcome }}
        run: |
          if [[ "${OUTCOME}" != failure ]]; then
            echo "::error::Expected the check of the bad title to fail, got ${OUTCOME}"
            exit 1
          fi
      # Release scripts (`.github/scripts/release.sh`): version checks and
      # release notes, on a scratch repository
      - name: Test release scripts
        run: bash tests/release/test.sh
      # Labels: labels/labels.yml is well-formed, and labels/sync.sh reports
      # and fixes differences (against a stubbed gh)
      - name: Test labels
        run: bash tests/labels/test.sh
      # gate: the rules, on sets of job results
      - name: Test gate rules
        run: bash tests/gate/test.sh
      # gate: the action itself. Passes only if `allow-skipped` reaches the
      # script
      - name: Check passing results
        uses: ./actions/gate
        with:
          needs: '{"lint": {"result": "success"}, "push": {"result": "skipped"}}'
          allow-skipped: push
      - name: Check failing results
        id: bad-results
        continue-on-error: true
        uses: ./actions/gate
        with:
          needs: '{"lint": {"result": "failure"}}'
      - name: Expect the failing results to fail
        env:
          OUTCOME: ${{ steps.bad-results.outcome }}
        run: |
          if [[ "${OUTCOME}" != failure ]]; then
            echo "::error::Expected the check of the failing results to fail, got ${OUTCOME}"
            exit 1
          fi
      # publish-release: the script (notes check, body, versions, calls of
      # `gh` against a stand-in)
      - name: Test publish-release script
        run: bash tests/publish-release/test.sh
      # publish-release: check-only mode against this repository's real API
      # (creating a release needs `contents: write` and a new tag). Depends
      # on this repository's tags: v1.0.0 has a published release, and
      # v0.0.0 doesn't exist. The script runs as the action runs it, so that
      # each case can assert its error; the action itself runs once, for its
      # wiring (inputs reaching the script)
      - name: Check release notes and tags
        env:
          GH_TOKEN: ${{ github.token }}
          # Not the fork's, which has other releases (public data)
          GH_REPO: elixir-cloud-aai/.github
          CHECK_ONLY: "true"
        run: |
          notes="${RUNNER_TEMP}/notes"
          mkdir -p "${notes}"
          printf 'Intro.\n\n## Fixes\n\n- A fix (#1, #2)\n' > "${notes}/good.md"
          printf 'Intro.\n\n## Commits\n\n- A fix (#1, #2)\n' > "${notes}/bad.md"
          python3 -I actions/publish-release/publish.py check "${notes}/good.md"
          # <tag> <notes> <expected error>
          expect() {
            local out
            if out="$(TAG="$1" NOTES="${notes}/$2" \
              python3 -I actions/publish-release/publish.py publish 2>&1)"; then
              echo "::error::Expected the check of $1 with $2 to fail"
              exit 1
            fi
            if [[ "${out}" != *"$3"* ]]; then
              echo "::error::Expected '$3', got: ${out}"
              exit 1
            fi
          }
          expect v1.0.0 bad.md "not in the format"
          expect v1.0.0 good.md "exists already"
          expect v0.0.0 good.md "The tag v0.0.0 doesn't exist"
      # The action uses the run's repository: only here, not in forks
      - name: Check a released tag with the action
        id: released-tag
        if: github.repository == 'elixir-cloud-aai/.github'
        continue-on-error: true
        uses: ./actions/publish-release
        with:
          notes: ${{ runner.temp }}/notes/good.md
          tag: v1.0.0
          prerelease: "false"
          check-only: "true"
      - name: Expect the check of the released tag to fail
        if: github.repository == 'elixir-cloud-aai/.github'
        env:
          OUTCOME: ${{ steps.released-tag.outcome }}
        run: |
          if [[ "${OUTCOME}" != failure ]]; then
            echo "::error::Expected the check of the released tag to fail, got ${OUTCOME}"
            exit 1
          fi
      # check-release: the script (versions, citation metadata, the checks
      # of tag, branch and CI against a stand-in for `gh`)
      - name: Test check-release script
        run: bash tests/check-release/test.sh
      # check-release: the checks against this repository's real API.
      # Depends on this repository's releases and tags: v1.0.0 is a
      # lightweight tag, and the latest release has a signed annotated tag
      # of a commit on `main` for which CI passed (each release requires
      # it, so the CI run is recent); there is no CITATION.cff. The script
      # runs as the action runs it, so that each case can assert its error;
      # the action itself runs once, for its wiring (inputs reaching the
      # script, outputs)
      - name: Find the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          # Not the fork's, which has other releases (public data)
          GH_REPO: elixir-cloud-aai/.github
        run: |
          tag="$(gh release view --json tagName --jq .tagName)"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected latest release '${tag}'"
            exit 1
          fi
          object="$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq .object.sha)"
          sha="$(gh api "repos/${GH_REPO}/git/tags/${object}" --jq .object.sha)"
          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected commit '${sha}' of ${tag}"
            exit 1
          fi
          {
            echo "RELEASED_TAG=${tag}"
            echo "RELEASED_VERSION=${tag#v}"
            echo "RELEASED_SHA=${sha}"
          } >> "${GITHUB_ENV}"
      - name: Check release tags
        env:
          GH_TOKEN: ${{ github.token }}
          # Not the fork's, which has other tags and runs (public data)
          GH_REPO: elixir-cloud-aai/.github
          TAG_PREFIX: v
          BRANCH: main
          WORKFLOW: ci.yml
          CI_BRANCH: main
        run: |
          # Another commit SHA, of no commit
          other=0123456789abcdef0123456789abcdef01234567
          # <tag> <commit> <citation> <expected errors...>
          expect() {
            local out message
            if out="$(TAG="$1" COMMIT="$2" CITATION="$3" \
              python3 -I actions/check-release/check.py 2>&1)"; then
              echo "::error::Expected the check of $1 at $2 to fail"
              exit 1
            fi
            for message in "${@:4}"; do
              if [[ "${out}" != *"${message}"* ]]; then
                echo "::error::Expected '${message}', got: ${out}"
                exit 1
              fi
            done
          }
          expect v1.0.0 "${RELEASED_SHA}" "" "Tag 'v1.0.0' is not annotated"
          expect "${RELEASED_TAG}" "${other}" "" "not to the commit of the run" \
            "Could not compare" "No successful run of the CI workflow"
          expect v1.2 "${RELEASED_SHA}" "" "Tag 'v1.2' is no release version"
          expect "${RELEASED_TAG}" "${RELEASED_SHA}" CITATION.cff \
            "Could not read CITATION.cff"
      # The action uses the run's repository: only here, not in forks
      - name: Check a released tag with the action
        id: release-check
        if: github.repository == 'elixir-cloud-aai/.github'
        uses: ./actions/check-release
        with:
          tag: ${{ env.RELEASED_TAG }}
          commit: ${{ env.RELEASED_SHA }}
          ci-branch: main
          citation: ""
          version: ${{ env.RELEASED_VERSION }}
      - name: Expect the outputs of the released tag
        if: github.repository == 'elixir-cloud-aai/.github'
        env:
          OUTPUTS: >-
            ${{ steps.release-check.outputs.version }}
            ${{ steps.release-check.outputs.prerelease }}
            ${{ steps.release-check.outputs.sha }}
        run: |
          expected="${RELEASED_VERSION} false ${RELEASED_SHA}"
          if [[ "${OUTPUTS}" != "${expected}" ]]; then
            echo "::error::Expected outputs '${expected}', got '${OUTPUTS}'"
            exit 1
          fi
      # release-image: the script (settings, the check of the version's
      # image tag, the `latest` decision and the tagging, against stand-ins
      # for `gh` and `docker`)
      - name: Test release-image script
        run: bash tests/release-image/test.sh
      # release-image: the script's checks and tags against a local
      # registry (two images, pushed by digest) and this repository's real
      # releases (v1.0.0 has a published release with a lower version than
      # the latest one; no version 999.0.0 or higher exists). Attesting and
      # signing need `id-token: write` and would publish attestations and
      # transparency log entries for test images, so they aren't run here
      - name: Push images to a local registry
        env:
          IMAGE: localhost:5000/release-image-test
        run: |
          docker run --detach --publish 5000:5000 --name registry registry:3.0.0
          for name in a b; do
            context="${RUNNER_TEMP}/image-${name}"
            mkdir -p "${context}"
            echo "${name}" > "${context}/${name}"
            printf 'FROM scratch\nCOPY %s /\n' "${name}" \
              | docker build --tag "${IMAGE}:build-${name}" --file - "${context}"
            docker push "${IMAGE}:build-${name}"
            digest="$(docker buildx imagetools inspect "${IMAGE}:build-${name}" \
              --format '{{ json .Manifest }}' | jq -r .digest)"
            echo "DIGEST_${name^^}=${digest}" >> "${GITHUB_ENV}"
          done
      - name: Check and tag images in the local registry
        env:
          GH_TOKEN: ${{ github.token }}
          # Not the fork's, which has other releases (public data)
          GH_REPO: elixir-cloud-aai/.github
          IMAGE: localhost:5000/release-image-test
          TAG_PREFIX: v
          LATEST: auto
        run: |
          script=actions/release-image/release.py
          # <image tag> <expected digest>
          expect_tag() {
            local actual
            actual="$(docker buildx imagetools inspect "${IMAGE}:$1" \
              --format '{{ json .Manifest }}' | jq -r .digest)"
            if [[ "${actual}" != "$2" ]]; then
              echo "::error::Expected ${IMAGE}:$1 at $2, got ${actual}"
              exit 1
            fi
          }
          # The highest release: the version and `latest`
          TAG=v999.0.0 DIGEST="${DIGEST_A}" python3 -I "${script}" check
          out="$(TAG=v999.0.0 DIGEST="${DIGEST_A}" python3 -I "${script}" tag)"
          [[ "${out}" == *"latest=true"* ]] || { echo "::error::${out}"; exit 1; }
          expect_tag 999.0.0 "${DIGEST_A}"
          expect_tag latest "${DIGEST_A}"
          # A re-run with the same digest passes; another digest fails
          TAG=v999.0.0 DIGEST="${DIGEST_A}" python3 -I "${script}" check
          if out="$(TAG=v999.0.0 DIGEST="${DIGEST_B}" \
            python3 -I "${script}" check 2>&1)"; then
            echo "::error::Expected another digest of 999.0.0 to fail"
            exit 1
          fi
          [[ "${out}" == *"already points to ${DIGEST_A}"* ]] \
            || { echo "::error::${out}"; exit 1; }
          # A lower release gets its version only; `latest` stays
          out="$(TAG=v1.0.0 DIGEST="${DIGEST_B}" python3 -I "${script}" tag)"
          [[ "${out}" == *"latest=false"* ]] || { echo "::error::${out}"; exit 1; }
          expect_tag 1.0.0 "${DIGEST_B}"
          expect_tag latest "${DIGEST_A}"
          # Never `latest`, even for the highest version
          out="$(TAG=v1000.0.0 DIGEST="${DIGEST_B}" LATEST=false GH_REPO='' \
            python3 -I "${script}" tag)"
          [[ "${out}" == *"latest=false"* ]] || { echo "::error::${out}"; exit 1; }
          expect_tag 1000.0.0 "${DIGEST_B}"
          expect_tag latest "${DIGEST_A}"
      # The action itself, for its wiring (inputs reaching the script): it
      # stops at its first step, as 999.0.0 points to another digest,
      # before anything is attested or signed
      - name: Release an image whose version points to another digest
        id: moved-version
        continue-on-error: true
        uses: ./actions/release-image
        with:
          image: localhost:5000/release-image-test
          digest: ${{ env.DIGEST_B }}
          tag: v999.0.0
      - name: Expect the release of the moved version to fail
        env:
          OUTCOME: ${{ steps.moved-version.outcome }}
          IMAGE: localhost:5000/release-image-test
        run: |
          if [[ "${OUTCOME}" != failure ]]; then
            echo "::error::Expected the release of the moved version to fail, got ${OUTCOME}"
            exit 1
          fi
          # Stopped before tagging: 999.0.0 still points to the first image
          actual="$(docker buildx imagetools inspect "${IMAGE}:999.0.0" \
            --format '{{ json .Manifest }}' | jq -r .digest)"
          if [[ "${actual}" != "${DIGEST_A}" ]]; then
            echo "::error::Expected ${IMAGE}:999.0.0 at ${DIGEST_A}, got ${actual}"
            exit 1
          fi
      # scan-image: the pip check (`check-pip.sh`), on made-up reports and
      # on reports cut down from real Trivy scans
      - name: Test scan-image pip check
        run: bash tests/scan-image/test.sh
      # scan-image: a clean image passes (also the pip check) and yields the
      # full report; an image with fixable critical and high findings fails;
      # an image with pip (here only its `.dist-info`) passes by default and
      # fails if `fail-on-pip` is true. No upload to code scanning (the job
      # has no `security-events: write`)
      - name: Prepare images to scan
        run: |
          printf 'vulnerabilities: []\n' > .trivyignore.yaml
          printf 'FROM scratch\nCOPY .trivyignore.yaml /\n' \
            | docker build --tag scan-image-test:clean --file - .
          pip_context="${RUNNER_TEMP}/pip-image"
          mkdir -p "${pip_context}/pip-26.0.dist-info"
          printf 'Metadata-Version: 2.1\nName: pip\nVersion: 26.0\n' \
            > "${pip_context}/pip-26.0.dist-info/METADATA"
          printf 'FROM scratch\nCOPY pip-26.0.dist-info %s\n' \
            /usr/local/lib/python3.13/site-packages/pip-26.0.dist-info \
            | docker build --tag scan-image-test:pip --file - "${pip_context}"
          docker pull alpine:3.10.0
      - name: Scan a clean image
        uses: ./actions/scan-image
        with:
          image: scan-image-test:clean
          category: test-clean
          upload: "false"
          report: "true"
          fail-on-pip: "true"
      - name: Expect the full report and the package list
        run: |
          jq -e '.ArtifactName == "scan-image-test:clean"' trivy-report.json
          jq -e '.ArtifactName == "scan-image-test:clean"' trivy-packages.json
          test -s trivy-results.sarif
          test -s trivy-report.txt
      - name: Scan an image with fixable findings
        id: bad-image
        continue-on-error: true
        uses: ./actions/scan-image
        with:
          image: alpine:3.10.0
          category: test-vulnerable
          upload: "false"
      - name: Expect the scan of the vulnerable image to fail
        env:
          OUTCOME: ${{ steps.bad-image.outcome }}
        run: |
          if [[ "${OUTCOME}" != failure ]]; then
            echo "::error::Expected the scan of the vulnerable image to fail, got ${OUTCOME}"
            exit 1
          fi
          # Failed because of findings, not before the scan
          jq -e '[.runs[].results[]] | length > 0' trivy-results.sarif
      # The check is off by default: no failure, and the package list of the
      # clean image is removed
      - name: Scan an image with pip (check off)
        uses: ./actions/scan-image
        with:
          image: scan-image-test:pip
          category: test-pip-default
          upload: "false"
          # Not to depend on pip 26.0 staying free of fixable findings
          fail: "false"
      - name: Expect no package list
        run: test ! -e trivy-packages.json
      # Only the pip check can fail this scan (`fail` is false)
      - name: Scan an image with pip
        id: pip-image
        continue-on-error: true
        uses: ./actions/scan-image
        with:
          image: scan-image-test:pip
          category: test-pip
          upload: "false"
          fail: "false"
          fail-on-pip: "true"
      - name: Expect the scan of the image with pip to fail
        env:
          OUTCOME: ${{ steps.pip-image.outcome }}
        run: |
          if [[ "${OUTCOME}" != failure ]]; then
            echo "::error::Expected the scan of the image with pip to fail, got ${OUTCOME}"
            exit 1
          fi
          # Failed because of pip, not before the package list
          jq -e '[.Results[]?.Packages[]? | select(.Name == "pip")] | length > 0' \
            trivy-packages.json

  passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Not `!cancelled()`: see "Cancelled runs" in actions/gate/README.md
    if: always()
    needs: [lint, test]
    permissions: {}
    steps:
      - name: Check results of all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r '
            to_entries[]
            | select(.value.result != "success")
            | "\(.key): \(.value.result)"' <<< "${NEEDS}")"
          if [[ -n "${failed}" ]]; then
            echo "::error::Jobs did not pass: ${failed//$'\n'/, }"
            exit 1
          fi
