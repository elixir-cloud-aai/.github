---
# Everything that must pass on pull requests and pushes to `main`: lint the
# Markdown, YAML (issue forms, workflows, the Dependabot configuration and,
# later, the composite actions in `actions/`) and the workflows (actionlint).
# Each composite action adds its tests here, in a `test` job. The gate
# `passed` ("CI passed") is the only required check. No `paths:` filters, so
# that the gate always reports; skip jobs with `if:` instead (and allow the
# skip in the gate)

name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs of a pull request; runs for pushes get their own
# group, so that queued runs for successive pushes are not dropped
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Not bumped by Dependabot (no Python manifest); update manually
      - name: Install pre-commit
        run: pip install pre-commit==4.7.0
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run linters and security checks
        run: |
          pre-commit run --all-files --show-diff-on-failure
          pre-commit run --all-files --hook-stage manual gitleaks-all

  passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [lint]
    permissions: {}
    steps:
      - name: Check results of all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r '
            to_entries[]
            | select(.value.result != "success")
            | "\(.key): \(.value.result)"' <<< "${NEEDS}")"
          if [[ -n "${failed}" ]]; then
            echo "::error::Jobs did not pass: ${failed//$'\n'/, }"
            exit 1
          fi
