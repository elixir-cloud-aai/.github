---
# Everything that must pass on pull requests and pushes to `main`: lint the
# Markdown, YAML (issue forms, workflows, the Dependabot configuration and
# the composite actions in `actions/`) and the workflows (actionlint), and
# test the composite actions (each action adds its tests to the `test` job)
# and the release scripts. A passed run for a push to `main` triggers the
# `Release` workflow (`release.yml`).
# The gate `passed` ("CI passed") is the only required check. No `paths:`
# filters, so that the gate always reports; skip jobs with `if:` instead (and
# allow the skip in the gate)

name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs of a pull request; runs for pushes get their own
# group, so that queued runs for successive pushes are not dropped
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Not bumped by Dependabot (no Python manifest); update manually
      - name: Install pre-commit
        run: pip install pre-commit==4.7.0
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run linters and security checks
        run: |
          pre-commit run --all-files --show-diff-on-failure
          pre-commit run --all-files --hook-stage manual gitleaks-all

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pr-title: the rules, on good and bad titles
      - name: Test PR title rules
        run: bash tests/pr-title/test.sh
      # pr-title: the action itself. Passes only if `types` (one per line)
      # reaches the script, as `deps` is not a default type
      - name: Check a good PR title
        uses: ./actions/pr-title
        with:
          title: "deps(api)!: bump pagination library"
          types: |
            fix
            deps
      # Valid but for `max-length`, so it fails only if that input reaches
      # the script
      - name: Check a bad PR title
        id: bad-title
        continue-on-error: true
        uses: ./actions/pr-title
        with:
          title: "feat(api): add pagination"
          max-length: "10"
      - name: Expect the bad PR title to fail
        env:
          OUTCOME: ${{ steps.bad-title.outcome }}
        run: |
          if [[ "${OUTCOME}" != failure ]]; then
            echo "::error::Expected the check of the bad title to fail, got ${OUTCOME}"
            exit 1
          fi
      # Release scripts (`.github/scripts/release.sh`): version planning
      # and release notes, on a scratch repository
      - name: Test release scripts
        run: bash tests/release/test.sh
      # gate: the rules, on sets of job results
      - name: Test gate rules
        run: bash tests/gate/test.sh
      # gate: the action itself. Passes only if `allow-skipped` reaches the
      # script
      - name: Check passing results
        uses: ./actions/gate
        with:
          needs: '{"lint": {"result": "success"}, "push": {"result": "skipped"}}'
          allow-skipped: push
      - name: Check failing results
        id: bad-results
        continue-on-error: true
        uses: ./actions/gate
        with:
          needs: '{"lint": {"result": "failure"}}'
      - name: Expect the failing results to fail
        env:
          OUTCOME: ${{ steps.bad-results.outcome }}
        run: |
          if [[ "${OUTCOME}" != failure ]]; then
            echo "::error::Expected the check of the failing results to fail, got ${OUTCOME}"
            exit 1
          fi
      # scan-image: a clean image passes and yields the full report; an image
      # with fixable critical and high findings fails. No upload to code
      # scanning (the job has no `security-events: write`)
      - name: Prepare images to scan
        run: |
          printf 'vulnerabilities: []\n' > .trivyignore.yaml
          printf 'FROM scratch\nCOPY .trivyignore.yaml /\n' \
            | docker build --tag scan-image-test:clean --file - .
          docker pull alpine:3.10.0
      - name: Scan a clean image
        uses: ./actions/scan-image
        with:
          image: scan-image-test:clean
          category: test-clean
          upload: "false"
          report: "true"
      - name: Expect the full report
        run: |
          jq -e '.ArtifactName == "scan-image-test:clean"' trivy-report.json
          test -s trivy-results.sarif
          test -s trivy-report.txt
      - name: Scan an image with fixable findings
        id: bad-image
        continue-on-error: true
        uses: ./actions/scan-image
        with:
          image: alpine:3.10.0
          category: test-vulnerable
          upload: "false"
      - name: Expect the scan of the vulnerable image to fail
        env:
          OUTCOME: ${{ steps.bad-image.outcome }}
        run: |
          if [[ "${OUTCOME}" != failure ]]; then
            echo "::error::Expected the scan of the vulnerable image to fail, got ${OUTCOME}"
            exit 1
          fi
          # Failed because of findings, not before the scan
          jq -e '[.runs[].results[]] | length > 0' trivy-results.sarif

  passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [lint, test]
    permissions: {}
    steps:
      - name: Check results of all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r '
            to_entries[]
            | select(.value.result != "success")
            | "\(.key): \(.value.result)"' <<< "${NEEDS}")"
          if [[ -n "${failed}" ]]; then
            echo "::error::Jobs did not pass: ${failed//$'\n'/, }"
            exit 1
          fi
