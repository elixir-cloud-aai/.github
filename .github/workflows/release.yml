---
# Releases the shared actions when the maintainer pushes a signed version
# tag `vX.Y.Z` (see RELEASING.md). `prepare` checks the tag (annotated,
# signature verified by GitHub, on a commit of `main` for which CI passed,
# the next version after the last release, see `.github/scripts/release.sh
# check`) and the curated notes `docs/releases/vX.Y.Z.md` of the tagged
# commit (`release.sh lint`). `publish` creates the GitHub release with the
# curated notes followed by GitHub's generated notes (`release.sh notes`),
# after approval in the `release` environment. Release tags are protected
# and immutable (tag rulesets). Callers' Dependabot then bumps their pins
# `@<commit> # vX.Y.Z`.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One run per tag, so that a run waiting for approval is not cancelled by
# the run of another tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Read the CI runs of the release commit
      actions: read
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and all tags, for the checks against `main` and the
          # last release
          fetch-depth: 0
      # Guards against accidental releases, e.g., of unmerged commits; the
      # `release` environment's protection rules (required reviewer) are
      # what actually control publishing
      - name: Check release tag and commit
        id: tag
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Annotated, with a signature that GitHub verified
          if [[ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]]; then
            echo "::error::Tag '${TAG}' is not annotated (git tag -s)"
            exit 1
          fi
          verified="$(gh api "repos/${REPOSITORY}/git/tags/$(git rev-parse "refs/tags/${TAG}")" \
            --jq .verification.verified)"
          if [[ "${verified}" != "true" ]]; then
            echo "::error::Tag '${TAG}' has no signature verified by GitHub (git tag -s)"
            exit 1
          fi
          # The tag still points to the commit of the event (e.g., on a
          # re-run)
          if [[ "$(git rev-parse "refs/tags/${TAG}^{commit}")" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag '${TAG}' no longer points to ${GITHUB_SHA}"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release commit is not on 'main'"
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
      - name: Check release version
        id: version
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: bash .github/scripts/release.sh check "${TAG}" "${SHA}" >> "${GITHUB_OUTPUT}"
      # Curated notes are published as written, so they must be finished
      # and in the organisation's format
      - name: Check release notes
        env:
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/release.sh lint "${TAG}" "docs/releases/${TAG}.md"
      # The checks above don't run the tests: require a successful run of
      # the CI workflow for the push of the release commit to `main`; runs
      # for pull requests test merge commits, not the commit itself.
      # Re-runs that succeeded count
      - name: Check that CI passed for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          runs="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&status=success&per_page=1" \
            --jq .total_count)"
          if [[ ! "${runs}" =~ ^[0-9]+$ || "${runs}" -lt 1 ]]; then
            echo "::error::No successful run of the CI workflow (ci.yml) for a push of ${SHA}; once CI passed for it, re-run this workflow"
            exit 1
          fi

  publish:
    name: Publish release
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      # Create the release
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      # A re-run after the release was created changes nothing (edit the
      # notes by hand if needed)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PREVIOUS: ${{ needs.prepare.outputs.previous }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          notes="${RUNNER_TEMP}/notes.md"
          bash .github/scripts/release.sh notes "${TAG}" "${PREVIOUS}" "${SHA}" \
            "docs/releases/${TAG}.md" > "${notes}"
          cat "${notes}" >> "${GITHUB_STEP_SUMMARY}"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "::notice::The release ${TAG} exists already"
          else
            gh release create "${TAG}" --verify-tag --title "${TAG}" \
              --notes-file "${notes}"
          fi
